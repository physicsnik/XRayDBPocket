<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 500" width="1024" height="500">
    <defs>
        <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#0B0C10" />
            <stop offset="50%" stop-color="#161B22" />
            <stop offset="100%" stop-color="#1F2833" />
        </linearGradient>
        <radialGradient id="glow" cx="80%" cy="50%" r="50%">
            <stop offset="0%" stop-color="#00FFFF" stop-opacity="0.15" />
            <stop offset="100%" stop-color="#0B0C10" stop-opacity="0" />
        </radialGradient>
    </defs>

    <!-- Background -->
    <rect width="1024" height="500" fill="url(#bgGrad)" />
    <rect width="1024" height="500" fill="url(#glow)" />

    <!-- Decorative Atomic Shells on Right -->
    <g transform="translate(800, 250)">
        <circle cx="0" cy="0" r="180" fill="none" stroke="#52607A" stroke-width="2" stroke-dasharray="8 4" opacity="0.4" />
        <circle cx="0" cy="0" r="120" fill="none" stroke="#52607A" stroke-width="2" opacity="0.6" />
        <circle cx="0" cy="0" r="50" fill="none" stroke="#52607A" stroke-width="2" opacity="0.8" />

        <!-- Nucleus -->
        <circle cx="0" cy="0" r="12" fill="#1F2833" stroke="#66FCF1" stroke-width="3" />
        <circle cx="0" cy="0" r="4" fill="#66FCF1" />

        <!-- Transition Arrow -->
        <line x1="-100" y1="-100" x2="-35" y2="-35" stroke="#E63946" stroke-width="4" stroke-linecap="round" />
        <polygon points="-35,-35 -48,-41 -41,-48" fill="#E63946" />

        <!-- Emitted Photon Wave -->
        <path d="M 50,0 Q 65,-20 80,0 T 110,0 T 140,0 T 170,0 L 200,0" fill="none" stroke="#B5179E" stroke-width="5" stroke-linecap="round" />
        <polygon points="200,0 188,-6 188,6" fill="#B5179E" />
    </g>

    <!-- Typography & Branding -->
    <g transform="translate(80, 180)">
        <!-- App Title -->
        <text x="0" y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="64" font-weight="900" fill="#FFFFFF" letter-spacing="1">XRayDB <tspan fill="#66FCF1">Pocket</tspan></text>

        <!-- Subtitle -->
        <text x="0" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="26" font-weight="600" fill="#C5C6C7">Offline X-Ray, XPS &amp; Synchrotron Reference</text>

        <!-- Feature Badges -->
        <g transform="translate(0, 110)">
            <rect x="0" y="0" width="160" height="42" rx="8" fill="#1F2833" stroke="#45A29E" stroke-width="1.5" />
            <text x="80" y="27" font-family="sans-serif" font-size="16" font-weight="bold" fill="#66FCF1" text-anchor="middle">118 Elements</text>

            <rect x="180" y="0" width="155" height="42" rx="8" fill="#1F2833" stroke="#45A29E" stroke-width="1.5" />
            <text x="257" y="27" font-family="sans-serif" font-size="16" font-weight="bold" fill="#66FCF1" text-anchor="middle">794+ Records</text>

            <rect x="355" y="0" width="140" height="42" rx="8" fill="#1F2833" stroke="#45A29E" stroke-width="1.5" />
            <text x="425" y="27" font-family="sans-serif" font-size="16" font-weight="bold" fill="#66FCF1" text-anchor="middle">XRF ID Tool</text>

            <rect x="515" y="0" width="165" height="42" rx="8" fill="#1F2833" stroke="#45A29E" stroke-width="1.5" />
            <text x="597" y="27" font-family="sans-serif" font-size="16" font-weight="bold" fill="#66FCF1" text-anchor="middle">Attenuation Calc</text>
        </g>
    </g>
</svg>
